name: Unity tests and builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PlayMode tests (with graphics)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Fork PRs have no repository secrets. Run their Unity checks after reviewing and copying the branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity binary assets
        run: python3 Tools/CI/check_unity_assets.py
      - name: Check Unity Personal activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name. See Tools/CI/README.md."
              exit 1
            fi
          done
      - name: Make room for the Unity container
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-tests-${{ runner.os }}-${{ hashFiles('ProjectSettings/**', 'Packages/**', 'Assets/**') }}
          restore-keys: |
            Library-tests-${{ runner.os }}-
      - name: Install pinned GameCI CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci_directory="$RUNNER_TEMP/game-ci-v0.1.72"
          mkdir -p "$ci_directory"
          gh release download v0.1.72 --repo game-ci/cli --pattern game-ci-linux-x64.tar.gz --dir "$ci_directory"
          printf '1de550a620ee92e05e920b6db7d431621440b60b2577f04b4a997dc92a58cb0a  %s\n' "$ci_directory/game-ci-linux-x64.tar.gz" | sha256sum --check
          tar -xzf "$ci_directory/game-ci-linux-x64.tar.gz" -C "$ci_directory"
      - name: Run all PlayMode tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash Tools/CI/run_tests.sh "$RUNNER_TEMP/game-ci-v0.1.72/game-ci"
      - name: Require real test execution, including graphics tests
        if: always()
        run: python3 Tools/CI/check_test_results.py artifacts/tests
      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playmode-results
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build ${{ matrix.artifact }}
    needs: tests
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      # Avoid simultaneous activations of the same Personal license in build jobs.
      max-parallel: 1
      matrix:
        include:
          - platform: Android
            runner: ubuntu-24.04
            output: build/Android/PudgeWars.apk
            artifact: android-apk
          - platform: StandaloneLinux64
            runner: ubuntu-24.04
            output: build/StandaloneLinux64/PudgeWars.x86_64
            artifact: linux-x86_64
          - platform: StandaloneLinux64
            runner: ubuntu-24.04
            output: build/LinuxServer/PudgeWarsServer.x86_64
            artifact: linux-server-x86_64
            buildMethod: PudgeWars.EditorTools.CiBuild.BuildLinuxServer
            parameters: -standaloneBuildSubtarget Server
          - platform: StandaloneOSX
            runner: macos-15-intel
            output: build/StandaloneOSX/PudgeWars.app
            artifact: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity binary assets
        run: python3 Tools/CI/check_unity_assets.py
      - name: Make room for the Unity container
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-build-${{ runner.os }}-${{ matrix.artifact }}-${{ hashFiles('ProjectSettings/**', 'Packages/**', 'Assets/**') }}
          restore-keys: |
            Library-build-${{ runner.os }}-${{ matrix.artifact }}-
      - name: Build saved scenes
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: ${{ matrix.platform }}
          buildMethod: ${{ matrix.buildMethod || 'PudgeWars.EditorTools.CiBuild.Build' }}
          buildName: PudgeWars
          buildsPath: build
          versioning: None
          customParameters: -ciOutputPath ${{ matrix.output }} ${{ matrix.parameters }}
          androidExportType: androidPackage
      - name: Package Android APK
        if: matrix.platform == 'Android'
        run: |
          mkdir -p artifacts/build
          cp build/Android/PudgeWars.apk artifacts/build/PudgeWars.apk
      - name: Smoke test Linux dedicated server without graphics
        if: matrix.artifact == 'linux-server-x86_64'
        run: |
          chmod +x build/LinuxServer/PudgeWarsServer.x86_64
          python3 Tools/Server/smoke_test.py build/LinuxServer/PudgeWarsServer.x86_64
      - name: Package Linux player with executable permissions
        if: matrix.artifact == 'linux-x86_64'
        run: |
          mkdir -p artifacts/build
          tar -czf artifacts/build/PudgeWars-linux-x86_64.tar.gz -C build/StandaloneLinux64 .
      - name: Package Linux dedicated server
        if: matrix.artifact == 'linux-server-x86_64'
        run: |
          mkdir -p artifacts/build
          cp Tools/Server/run-server.sh Tools/Server/pudgewars.service Tools/Server/README.md build/LinuxServer/
          chmod +x build/LinuxServer/PudgeWarsServer.x86_64 build/LinuxServer/run-server.sh
          tar -czf artifacts/build/PudgeWars-linux-server-x86_64.tar.gz -C build/LinuxServer .
      - name: Package macOS app with its bundle metadata
        if: matrix.platform == 'StandaloneOSX'
        run: |
          mkdir -p artifacts/build
          ditto -c -k --sequesterRsrc --keepParent build/StandaloneOSX/PudgeWars.app artifacts/build/PudgeWars-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/build
          if-no-files-found: error
          retention-days: 7
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.artifact }}
          path: |
            build/**/*.log
            Logs/Editor.log
            artifacts/server-smoke.log
          if-no-files-found: ignore
          retention-days: 7
